<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Servis veš mašina sa zakošenim ključem</title>

  <!-- 1. White Machine Body -->
  <rect x="1" y="1" width="62" height="62" rx="8" fill="#FFFFFF"/>

  <!-- 2. Orange Top Panel -->
  <rect x="1" y="1" width="62" height="18" rx="8" fill="#EA580C"/>
  <rect x="1" y="10" width="62" height="8" fill="#EA580C"/>

  <!-- 3. Panel Separator Line -->
  <line x1="1" y1="18" x2="63" y2="18" stroke="#0F172A" stroke-width="1.5"/>

  <!-- 4. Detergent Drawer -->
  <rect x="8" y="7.5" width="18" height="4" rx="2" fill="#FFFFFF"/>

  <!-- 5. Program Dial Knob -->
  <circle cx="53" cy="9.5" r="3.5" fill="#0F172A"/>

  <!-- 6. Drum Assembly (Dark Glass for Maximum Tool Visibility) -->
  <circle cx="32" cy="41" r="16" fill="#0F172A"/>
  <circle cx="32" cy="41" r="12.5" fill="#0A0F1D"/>
  <path d="M 24 37 A 9 9 0 0 1 37 34" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- 7. Outer Dark Border -->
  <rect x="1" y="1" width="62" height="62" rx="8" fill="none" stroke="#0F172A" stroke-width="1.5"/>

  <!-- 8. Large Bold Tilted Wrench (-15 deg) -->
  <g transform="translate(32, 41) rotate(-15) scale(1.45) translate(-12, -12)">
    <!-- White Contrast Halo -->
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="#EA580C" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Orange Wrench Body with Dark Edge -->
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="#EA580C" stroke="#0F172A" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Handle Eyelet -->
    <circle cx="4.5" cy="19.5" r="1.1" fill="#FFFFFF"/>
  </g>
</svg>
