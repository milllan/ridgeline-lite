<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Servis veš mašina</title>

  <!-- 1. White Machine Body (Stretched from 50px to 62px wide) -->
  <rect x="1" y="1" width="62" height="62" rx="8" fill="#FFFFFF"/>

  <!-- 2. Orange Top Panel -->
  <rect x="1" y="1" width="62" height="18" rx="8" fill="#EA580C"/>
  <rect x="1" y="10" width="62" height="8" fill="#EA580C"/>

  <!-- 3. Panel Separator Line -->
  <line x1="1" y1="18" x2="63" y2="18" stroke="#0F172A" stroke-width="1.5"/>

  <!-- 4. Detergent Drawer -->
  <rect x="8" y="7.5" width="18" height="4" rx="2" fill="#FFFFFF"/>

  <!-- 5. Program Dial Knob -->
  <circle cx="53" cy="9.5" r="3.5" fill="#0F172A"/>

  <!-- 6. Drum Assembly (Scaled up slightly to fill the wider body) -->
  <circle cx="32" cy="41" r="16" fill="#0F172A"/>
  <circle cx="32" cy="41" r="11.5" fill="#FFFFFF"/>
  <circle cx="32" cy="41" r="7" fill="#EA580C"/>
  <path d="M32 34a7 7 0 0 1 7 7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- 7. Very Thin Dark Outer Border (1.5px stroke instead of 7px solid block) -->
  <rect x="1" y="1" width="62" height="62" rx="8" fill="none" stroke="#0F172A" stroke-width="1.5"/>
</svg>